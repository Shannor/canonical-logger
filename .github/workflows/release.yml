name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race -v ./...

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Warm pkg.go.dev module proxy
        run: |
          PROXY_URL="https://proxy.golang.org/github.com/Shannor"
          MOD_PATH="canonical-logger/@v/${GITHUB_REF_NAME}.info"
          curl -fsSL "${PROXY_URL}/${MOD_PATH}" >/dev/null || true
